# Reference selection of the UH K*ll offline script (ntupleProduction/ntuple_plots.py),
# the arXiv:2206.05946 selection without the BDT. Used by Mode 1 / cutflow_reproduction.
reference: ntupleProduction/ntuple_plots.py
reference_kind: >-
  human-written UH offline analysis script (unpublished). Its cutflow is NOT a
  published result: call it "the reference cutflow of the UH offline script",
  never "the published reference cutflow". The paper below is the selection it
  follows, not the source of the reference numbers.
paper: arXiv:2206.05946
channels:            # branch prefixes substituted into the expressions below
  B0_ee:    {LEP: e,  B: B0, ID: electronID, PMIN: 0.4}
  B0_mumu:  {LEP: mu, B: B0, ID: muonID,     PMIN: 0.8}
  Bp_ee:    {LEP: e,  B: B,  ID: electronID, PMIN: 0.4}
  Bp_mumu:  {LEP: mu, B: B,  ID: muonID,     PMIN: 0.8}
truth_match: "(isSignal == 1)"      # keep the parentheses when combining with & (operator precedence)
event_id: ["__run__", "__event__"]
cuts:
  - name: K* mass window
    expr: "(Kstr_M > 0.796) & (Kstr_M < 0.996)"
    targets: combinatorial K pi
  - name: charmonium vetoes
    expr:
      e:  "((m_ll < 2.846) | (m_ll > 3.176)) & ((m_ll < 3.439) | (m_ll > 3.719)) & (m_ll > 0.14)"
      mu: "((m_ll < 2.946) | (m_ll > 3.176)) & ((m_ll < 3.539) | (m_ll > 3.719))"
    targets: B -> J/psi K*, B -> psi(2S) K*, photon conversions (ee)
  - name: lepton ID and momentum
    expr: "({LEP}1_{B}_{ID} > 0.9) & ({LEP}2_{B}_{ID} > 0.9) & ({LEP}1_{B}_p > {PMIN}) & ({LEP}2_{B}_p > {PMIN})"
    targets: hadrons misidentified as leptons
  - name: kaon ID
    expr:
      B0: "(K_Kstr_kaonID / (K_Kstr_kaonID + K_Kstr_pionID) > 0.6)"
      B:  "(Kstr_decayModeID == 2) | (K_Kstr_kaonID / (K_Kstr_kaonID + K_Kstr_pionID) > 0.6)"
    targets: "pi -> K misidentification (charged channel: skipped in the K_S pi+ sub-mode, decayModeID 2)"
  - name: pion ID
    expr:
      B0: "(pi_Kstr_pionID / (pi_Kstr_pionID + pi_Kstr_kaonID) > 0.6)"
      B:  "(Kstr_decayModeID == 1) | (pi_Kstr_pionID / (pi_Kstr_pionID + pi_Kstr_kaonID) > 0.6)"
    targets: "K -> pi misidentification (charged channel: skipped in the K+ pi0 sub-mode, decayModeID 1)"
    # The neutral-channel ntuples carry Kstr_decayModeID == 1 for every candidate
    # (it is not a sub-mode switch there), so the charged-channel expression would
    # silently bypass the pion ID in B0 channels: use the B0 expressions for B0_ee/B0_mumu.
best_candidate: "abs(deltaE)"      # lowest wins, among candidates passing all cuts
signal_box: "(Mbc > 5.27) & (Mbc < 5.29) & (abs(deltaE) < 0.05)"
counting:
  signal_stages: events with at least one truth-matched candidate passing the cuts so far
  generic: candidates
  box: >-
    the best candidate is chosen among ALL candidates passing cuts 1-5
    (no truth condition in the selection: tool argument best_by="abs(deltaE)");
    the signal box and the truth match are then applied to that one chosen
    candidate (tool argument post_selection="(isSignal == 1) & (Mbc > 5.27)
    & (Mbc < 5.29) & (abs(deltaE) < 0.05)"). Putting isSignal == 1 into the
    selection before the best-candidate choice counts events with ANY
    truth-matched candidate and overestimates the box stage by 0.5-1.6 pp.
reference_cutflow_percent:          # truth-matched, % of 12500 generated per channel
  B0_mumu: [64.0, 56.3, 47.9, 29.3, 26.4]
  B0_ee:   [61.8, 54.9, 31.8, 23.0, 17.9]
  Bp_mumu: [34.5, 30.1, 25.3, 16.4, 12.1]
  Bp_ee:   [33.7, 29.4, 16.4, 12.7, 8.1]
